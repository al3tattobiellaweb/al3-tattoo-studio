<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404 · Pagina non trovata · AL3 Tattoo Studio</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0a0b" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    /* the studio at night: warm ink, bone text, the red and blue neon from the two sides */
    :root { --ink: #0b0a0b; --bone: #eee8e1; --bone-2: #b9b1aa; --red: #d3172b; --red-hi: #ff3346; }
    * { box-sizing: border-box; }
    html { background: var(--ink); color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; color: var(--bone);
      font-family: "Archivo", system-ui, sans-serif; font-size: 16px; line-height: 1.55; text-align: center;
      background: radial-gradient(50% 70% at 0% 40%, rgba(211, 23, 43, .16), transparent 70%), radial-gradient(50% 70% at 100% 60%, rgba(59, 124, 255, .13), transparent 70%), var(--ink); }
    main { max-width: 34rem; }
    img { width: 96px; height: auto; display: block; margin: 0 auto 18px; }
    .code { margin: 0 0 6px; font-family: "Cinzel", "Trajan Pro", serif; font-weight: 600; font-size: clamp(44px, 11vw, 84px); line-height: 1;
      letter-spacing: .04em; color: var(--bone); text-shadow: -2px 0 12px rgba(255, 51, 70, .55), 2px 0 12px rgba(59, 124, 255, .5); } /* the two neons */
    h1 { margin: 0; font-family: "Cinzel", "Trajan Pro", serif; font-weight: 600; font-size: clamp(34px, 7vw, 56px); line-height: 1.05; letter-spacing: .02em; }
    .script { margin: 10px 0 0; font-family: "Pinyon Script", cursive; font-size: clamp(24px, 5vw, 32px); color: var(--red-hi); }
    p { color: var(--bone-2); margin: 18px 0 30px; }
    a { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 26px; border-radius: 999px;
      background: var(--red); color: #fff; font-weight: 600; text-decoration: none; transition: background .25s; }
    a:hover { background: #a8101f; }
    a:focus-visible { outline: 2px solid var(--red-hi); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/al3.webp" alt="AL3 Tattoo Studio" width="96" height="96" />
    <p class="code">404</p>
    <h1>Pagina non trovata</h1>
    <p class="script">Qui non c'è inchiostro.</p>
    <p>Questa pagina non esiste, o non esiste più. I lavori, lo studio e gli orari sono tutti nella pagina principale.</p>
    <a href="/">Torna allo studio</a>
  </main>
</body>
</html>
